<svg width="100%" viewBox="0 0 680 650" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>AI CRM Platform architecture diagram</title>
<desc>Customer, agent, and admin browsers connect to a React frontend, which calls a Django REST API. The API runs inside a dockerized backend alongside PostgreSQL, Redis, a Celery worker, and the Gemini AI service. Prometheus scrapes metrics from the API and Celery worker, and Grafana visualizes them.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="650" fill="#FFFFFF"/>

<!-- Client layer -->
<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
  <rect x="65" y="30" width="170" height="44" rx="8"/>
  <rect x="255" y="30" width="170" height="44" rx="8"/>
  <rect x="445" y="30" width="170" height="44" rx="8"/>
</g>
<g font-size="14" font-weight="500" fill="#444441" text-anchor="middle">
  <text x="150" y="56">Customer browser</text>
  <text x="340" y="56">Agent browser</text>
  <text x="530" y="56">Admin browser</text>
</g>

<line x1="340" y1="74" x2="340" y2="104" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Frontend -->
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
  <rect x="190" y="104" width="300" height="56" rx="8"/>
</g>
<g text-anchor="middle">
  <text x="340" y="124" font-size="14" font-weight="500" fill="#085041">React frontend</text>
  <text x="340" y="144" font-size="12" fill="#0F6E56">React Router · Tailwind · Axios</text>
</g>

<line x1="340" y1="160" x2="340" y2="250" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Backend container -->
<g fill="#F8F7F2" stroke="#888780" stroke-width="0.5">
  <rect x="40" y="194" width="600" height="304" rx="20"/>
</g>
<text x="60" y="222" font-size="14" font-weight="500" fill="#444441">Dockerized backend services</text>

<!-- API -->
<g fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5">
  <rect x="210" y="250" width="260" height="56" rx="8"/>
</g>
<g text-anchor="middle">
  <text x="340" y="270" font-size="14" font-weight="500" fill="#0C447C">Django REST API</text>
  <text x="340" y="290" font-size="12" fill="#185FA5">JWT auth + RBAC middleware</text>
</g>

<path d="M340 306 L340 320 L150 320 L150 336" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="306" x2="340" y2="336" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Data layer -->
<g fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5">
  <rect x="70" y="336" width="160" height="56" rx="8"/>
  <rect x="260" y="336" width="160" height="56" rx="8"/>
</g>
<g text-anchor="middle">
  <text x="150" y="356" font-size="14" font-weight="500" fill="#633806">PostgreSQL</text>
  <text x="150" y="376" font-size="12" fill="#854F0B">Primary database</text>
  <text x="340" y="356" font-size="14" font-weight="500" fill="#633806">Redis</text>
  <text x="340" y="376" font-size="12" fill="#854F0B">Cache &amp; broker</text>
</g>

<path d="M340 392 L340 408 L165 408 L165 422" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Celery -->
<g fill="#FAECE7" stroke="#993C1D" stroke-width="0.5">
  <rect x="70" y="422" width="190" height="56" rx="8"/>
</g>
<g text-anchor="middle">
  <text x="165" y="442" font-size="14" font-weight="500" fill="#712B13">Celery worker</text>
  <text x="165" y="462" font-size="12" fill="#993C1D">Async task queue</text>
</g>

<line x1="262" y1="450" x2="288" y2="450" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Gemini AI -->
<g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5">
  <rect x="290" y="422" width="210" height="56" rx="8"/>
</g>
<g text-anchor="middle">
  <text x="395" y="442" font-size="14" font-weight="500" fill="#3C3489">Gemini AI</text>
  <text x="395" y="462" font-size="12" fill="#534AB7">Classification &amp; priority</text>
</g>

<!-- Monitoring scrape lines -->
<path d="M470 278 L560 278 L560 520 L260 520 L260 538" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4" marker-end="url(#arrowDash)"/>
<path d="M165 478 L165 526 L290 526 L290 538" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4" marker-end="url(#arrowDash)"/>

<!-- Observability -->
<g fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5">
  <rect x="190" y="538" width="160" height="56" rx="8"/>
  <rect x="390" y="538" width="160" height="56" rx="8"/>
</g>
<g text-anchor="middle">
  <text x="270" y="558" font-size="14" font-weight="500" fill="#27500A">Prometheus</text>
  <text x="270" y="578" font-size="12" fill="#3B6D11">Metrics collector</text>
  <text x="470" y="558" font-size="14" font-weight="500" fill="#27500A">Grafana</text>
  <text x="470" y="578" font-size="12" fill="#3B6D11">Dashboards &amp; alerts</text>
</g>

<line x1="350" y1="566" x2="388" y2="566" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

</svg>
