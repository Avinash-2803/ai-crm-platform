version: "3.9"

services:

  db:
    image: postgres:16

    container_name: crm_postgres

    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: crm_redis

    ports:
      - "6379:6379"

  web:
    build: .

    container_name: crm_backend

    command: python manage.py runserver 0.0.0.0:8000

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis

    volumes:
      - .:/app

  worker:
    build: .

    container_name: crm_worker

    command: celery -A crm worker --loglevel=info

    depends_on:
      - db
      - redis

    volumes:
      - .:/app

  prometheus:
    image: prom/prometheus

    container_name: crm_prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - web

  grafana:
    image: grafana/grafana

    container_name: crm_grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data: